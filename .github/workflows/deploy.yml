name: Controlli manuali del sito

# La pubblicazione su Aruba verrà configurata dopo aver verificato
# protocollo sicuro, file pubblici, backup e autorizzazione al deploy.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Verifica dei file statici
    runs-on: ubuntu-latest
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Controlla collegamenti e sintassi JavaScript
        run: |
          python3 scripts/check_site.py
          node --check app.js
          node --check contenuti.js
