name: Pubblica sito su Aruba

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Pubblicare su Aruba dopo test e backup (solo dopo verifica hosting)?'
        type: boolean
        default: false
        required: true

permissions:
  contents: read

concurrency:
  group: aruba-production
  cancel-in-progress: false

jobs:
  publish:
    name: Controlli e pubblicazione solo se richiesta
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SITE_URL: https://www.simonevacca.it
      DEPLOY_REVISION: ${{ github.sha }}
      USE_PLAYWRIGHT_BROWSER: '1'
    steps:
      - name: Scarica il codice
        uses: actions/checkout@v4

      - name: Prepara Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepara Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Controlla collegamenti e sintassi JavaScript
        run: |
          python3 scripts/build_pages.py --check
          python3 scripts/check_site.py
          python3 scripts/check_js.py

      - name: Installa gli strumenti di test
        run: |
          python3 -m pip install --disable-pip-version-check -r requirements-test.txt
          python3 -m playwright install --with-deps chromium

      - name: Prova backup, trasferimento FTPS e homepage
        run: |
          python3 -m unittest discover -s tests -p 'test_*.py' -v
          node tests/algorithms.test.js
          node tests/efficiency.test.js
          python3 -u tests/browser_smoke.py
          python3 -u tests/lab_smoke.py
          python3 -u tests/platform_smoke.py

      - name: Prepara soltanto i file pubblici
        run: python3 scripts/deploy_site.py build

      - name: Conserva il pacchetto da revisionare
        uses: actions/upload-artifact@v4
        with:
          name: sito-da-revisionare
          path: dist/site/
          retention-days: 7

      - name: Verifica ramo prima della pubblicazione richiesta
        if: ${{ inputs.publish && github.ref != 'refs/heads/main' }}
        run: |
          echo "Pubblicazione consentita solo dal ramo main."
          exit 1

      - name: Salva i file online prima di modificarli
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT }}
        run: python3 scripts/deploy_site.py backup

      - name: Conserva il backup su GitHub prima del caricamento
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@v4
        with:
          name: aruba-backup-${{ github.run_id }}-${{ github.run_attempt }}
          path: backups/predeploy/
          if-no-files-found: error
          retention-days: 30

      - name: Carica e verifica i file via FTPS
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_SERVER_DIR: ${{ vars.FTP_SERVER_DIR || secrets.FTP_SERVER_DIR }}
          FTP_PORT: ${{ vars.FTP_PORT }}
        run: python3 scripts/deploy_site.py deploy

      - name: Controlla la versione visibile sul sito HTTPS
        if: ${{ inputs.publish && github.ref == 'refs/heads/main' }}
        run: python3 scripts/deploy_site.py verify
